name: cmlabs_connect
description: "A new Flutter project."
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ">=3.5.0-234.0.dev <4.0.0"

dependencies:
  screenshot: ^3.0.0
  image_gallery_saver_plus: ^4.0.1  
  cached_network_image: ^3.4.1
  calendar_date_picker2: ^1.1.7
  cupertino_icons: ^1.0.8
  device_info_plus: ^11.3.0
  dio: ^5.7.0
  double_tap_to_exit: ^1.0.2
  file_picker: ^10.1.9
  firebase_analytics: ^11.4.6
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6
  flutter:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1
  flutter_local_notifications: ^18.0.1
  flutter_native_splash: ^2.4.3
  flutter_secure_storage: ^9.2.4
  flutter_slidable: ^4.0.0
  flutter_sticky_header: ^0.7.0
  fluttertoast: ^8.2.12
  get: ^4.6.6
  google_fonts: ^6.2.1
  http: ^1.2.2
  image_picker: ^1.1.2
  intl: ^0.19.0
  ionicons: ^0.2.2
  loading_animation_widget: ^1.3.0
  open_filex: ^4.7.0
  path_provider: ^2.1.5
  permission_handler: ^11.4.0
  pull_to_refresh_new: ^2.0.5
  safe_password_generator: ^1.0.0
  syncfusion_flutter_charts: ^29.1.39
  timeago: ^3.7.0
  url_launcher: ^6.3.1
dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/logos/logo_foreground.png"
  adaptive_icon_background: "#18A0FB"
  adaptive_icon_foreground: "assets/images/logos/logo_foreground.png"

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/images/
    - assets/images/logos/
    - assets/icons/

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
